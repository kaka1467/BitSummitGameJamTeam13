name: Unity WebGL Build and Deploy

on:
  workflow_dispatch: # 手動実行用
  push:
    branches:
      - main # mainブランチにプッシュされた時に動作

jobs:
  build:
    name: Build and Notify
    runs-on: ubuntu-latest
    steps:
      # --- ディスク容量確保 ---
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      # --- チェックアウト ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # --- キャッシュ設定 ---
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-WebGL

      # --- Unityビルド ---
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL

      # --- GitHub Pagesへデプロイ ---
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/WebGL/WebGL
          branch: gh-pages

      # --- Discord通知（修正版） ---
      - name: Send Discord Notification
        if: success()
        env:
          # メッセージを取得し、手動実行の場合は代替テキストを入れる
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual Run' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # ヒアドキュメント(EOF)を使うことで、メッセージ内の特殊文字によるJSON崩れを防ぐ
          curl -H "Content-Type: application/json" \
          -X POST \
          -d @- <<EOF $DISCORD_WEBHOOK
          {
            "embeds": [{
              "title": "Success: 🎮 Unity WebGL ビルド成功！",
              "color": 3066993,
              "fields": [
                {"name": "プロジェクト", "value": "${{ github.repository }}", "inline": true},
                {"name": "ブランチ", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "コミット", "value": "${{ github.sha }}", "inline": true},
                {"name": "🌐 プレイ可能URL", "value": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
              ],
              "description": "**コミットメッセージ:**\n$COMMIT_MSG"
            }]
          }
          EOF
